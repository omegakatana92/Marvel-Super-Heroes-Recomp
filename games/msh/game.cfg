# Marvel Super Heroes (Capcom 1995, CPS-2 arcade board): per-game settings read by
# the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Marvel Super Heroes
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel Super Heroes Recomp
id = msh
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.msh
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `msh` is MAME's parent set (Euro 951024); its clones (mshu, mshj, mshjr1, msha, mshh, mshb, mshbr1,
# mshud) are built from the same board and are not accepted.
rom_set = msh
rom_parent = msh
rom_name = Marvel Super Heroes (Euro 951024)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side
# by side per row (64-bit words), two rows of 4 MiB files (32 MiB in all): msh.13m/15m/17m/19m, then
# msh.14m/16m/18m/20m, and the region is populated from 0. sound_program: the Z80's ROMs (msh.01,
# msh.02). samples: the QSound chip's (msh.11m, msh.12m, 4 MiB). key: the board's cipher key.
program = mshe.03e:bd951414 mshe.04e:19dd42f2 msh.05:6a091b9e msh.06b:803e3fa4 msh.07a:c45f8e27 msh.08a:9ca6f12c msh.09a:82ec27af msh.10b:8d931196
graphics = msh.13m:09d14566 msh.15m:ee962057 msh.17m:604ece14 msh.19m:94a731e8 msh.14m:4197973e msh.16m:438da4a0 msh.18m:4db92d94 msh.20m:a2b0c6c0
sound_program = msh.01:c976e6f9 msh.02:ce67d0d9
samples = msh.11m:37ac6d30 msh.12m:de092570
key = msh.key:b494368e

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
